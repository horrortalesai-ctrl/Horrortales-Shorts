name: Descubrimiento semanal

on:
  schedule:
    # Cada viernes a las 07:15 UTC (08:15/09:15 en Europa Central, según horario estacional).
    - cron: "15 7 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar y puntuar casos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run discover

      - name: Validar resultado
        run: npm run check

      - name: Guardar actualización
        run: |
          git config user.name "horrortales-bot"
          git config user.email "horrortales-bot@users.noreply.github.com"
          git add data/weekly-cases.json data/weekly-cases.js
          if git diff --cached --quiet; then
            echo "No hay casos nuevos esta semana."
          else
            git commit -m "data: actualizar casos semanales"
            git push
          fi
